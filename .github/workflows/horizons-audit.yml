name: Optional JPL Horizons Moon and Pluto barycenter/center audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  horizons_public_epochs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional astronomy module
        run: python -m pip install -r requirements-astronomy.txt
      - name: Fetch JPL Moon 301, Pluto barycenter 9, Pluto body center 999
        env:
          SRS_HORIZONS_CONTACT: https://github.com/${{ github.repository }}
        run: >-
          python scripts/fetch_horizons.py --fetch --strict --timeout 50
          --targets Moon PlutoBarycenter PlutoCenter
          --swiss-engine moseph --tolerance-arcsec 30 --output-dir .horizons-audit
      - name: Recompare archived original JPL outputs (archive provenance weaker)
        run: >-
          python scripts/fetch_horizons.py --from-archive .horizons-audit --strict
          --targets Moon PlutoBarycenter PlutoCenter
          --swiss-engine moseph --tolerance-arcsec 30
      - name: Archive raw official response, exact query and SHA256 hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizons-moon-pluto-9-999-public-audit
          path: .horizons-audit/
          if-no-files-found: warn
